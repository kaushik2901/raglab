services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-rag}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-rag}
      POSTGRES_DB: ${PG_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rag}"]
      interval: 3s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  workerd:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.25}
    image: gitlab-handbook-rag-pipeline
    command: ["workerd"]
    environment:
      DATABASE_URL: postgres://${PG_USER:-rag}:${PG_PASSWORD:-rag}@postgres:5432/${PG_DB:-rag}?sslmode=disable
      QDRANT_URL: http://qdrant:6334
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${LLM_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${LLM_BASE_URL:-https://api.openai.com}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDER_RATE_LIMIT_RPM: ${EMBEDDER_RATE_LIMIT_RPM:-500}
      GENERATOR_RATE_LIMIT_RPM: ${GENERATOR_RATE_LIMIT_RPM:-30}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-20}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_BACKOFF: ${RETRY_BACKOFF:-5s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_INDEX_FILE_SIZE: ${MAX_INDEX_FILE_SIZE:-104857600}
    volumes:
      - ./workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.25}
    image: gitlab-handbook-rag-pipeline
    command: ["api"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${PG_USER:-rag}:${PG_PASSWORD:-rag}@postgres:5432/${PG_DB:-rag}?sslmode=disable
      QDRANT_URL: http://qdrant:6334
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${LLM_API_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-${LLM_BASE_URL:-https://api.openai.com}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDER_RATE_LIMIT_RPM: ${EMBEDDER_RATE_LIMIT_RPM:-500}
      GENERATOR_RATE_LIMIT_RPM: ${GENERATOR_RATE_LIMIT_RPM:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: ${API_PORT:-8080}
    volumes:
      - ./workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  nginx:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - api

volumes:
  pg_data:
  qdrant_storage:
